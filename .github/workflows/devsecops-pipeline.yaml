name: DevSecOps Defense-in-Depth Pipeline - VulnerableMart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  # ==========================================
  # STAGE 1: Code & Secret Security (Fail Fast)
  # ==========================================
  code-and-secret-security:
    name: Stage 1 - Code & Secret Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          head: ${{ github.sha }}
          extra_args: --debug --only-verified --json
        continue-on-error: true

      - name: Generate TruffleHog Output Artifact
        run: |
          trufflehog git file://. --json --only-verified > trufflehog-results.json || true

      - name: Upload TruffleHog Scan Results to DefectDojo
        if: always()
        run: |
          if [ -f trufflehog-results.json ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Trufflehog3 Scan" \
              -F "file=@trufflehog-results.json" \
              -F "product_name=VulnerableMart" \
              -F "engagement_name=CI/CD" \
              -F "auto_create_context=true" || true
          fi

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.projectKey=vulnerablemart-api
            -Dsonar.projectName=VulnerableMart
            -Dsonar.sources=.
            -Dsonar.python.version=3.11
        continue-on-error: true



      - name: Snyk SCA Dependency Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --severity-threshold=high --json-file-output=snyk-results.json
        continue-on-error: true

      - name: Upload Snyk Scan Results to DefectDojo
        if: always()
        run: |
          if [ -f snyk-results.json ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Snyk Scan" \
              -F "file=@snyk-results.json" \
              -F "product_name=VulnerableMart" \
              -F "engagement_name=CI/CD" \
              -F "auto_create_context=true" || true
          fi

  # ==========================================
  # STAGE 2: Container Security & Build
  # ==========================================
  container-security-and-build:
    name: Stage 2 - Container Security & Build
    runs-on: ubuntu-latest
    needs: code-and-secret-security
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define Image Tag
        id: meta
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vulnerablemart-api/${{ matrix.service }}:${{ github.sha }}"
          echo "image=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }} \
            ./${{ matrix.service }}

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: json
          output: trivy-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Upload Trivy Scan Results to DefectDojo
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Trivy Scan" \
              -F "file=@trivy-results.json" \
              -F "product_name=VulnerableMart" \
              -F "engagement_name=CI/CD" \
              -F "auto_create_context=true" || true
          fi

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push ${{ steps.meta.outputs.image }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker Image (Keyless OIDC)
        run: |
          cosign sign --yes ${{ steps.meta.outputs.image }}

  # ==========================================
  # STAGE 3: Deployment & Manifest Validation
  # ==========================================
  deploy:
    name: Stage 3 - Deployment & Policy Validation
    runs-on: ubuntu-latest
    needs: container-security-and-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Validate Kubernetes Manifests with Kyverno
        run: |
          kyverno apply .github/policies -r k8s/

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Create or Update Image Pull Secret in K3s
        run: |
          kubectl create secret docker-registry gcp-registry-secret \
            --docker-server=us-central1-docker.pkg.dev \
            --docker-username=oauth2accesstoken \
            --docker-password="${{ steps.auth.outputs.access_token }}" \
            --insecure-skip-tls-verify=true \
            --dry-run=client -o yaml | kubectl apply -f - --insecure-skip-tls-verify=true

      - name: Update Image Tags in Manifests
        run: |
          sed -i "s|image: order-service:latest|image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vulnerablemart-api/order-service:${{ github.sha }}|g" k8s/order-deployment.yaml
          sed -i "s|image: inventory-service:latest|image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vulnerablemart-api/inventory-service:${{ github.sha }}|g" k8s/inventory-deployment.yaml
          sed -i "s|image: payment-service:latest|image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vulnerablemart-api/payment-service:${{ github.sha }}|g" k8s/payment-deployment.yaml
          sed -i "s|image: notification-service:latest|image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vulnerablemart-api/notification-service:${{ github.sha }}|g" k8s/notification-deployment.yaml

      - name: Clean up Stale Pods
        run: |
          kubectl delete pods --field-selector status.phase=Failed --insecure-skip-tls-verify=true --ignore-not-found=true || true

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/ --insecure-skip-tls-verify=true

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/order-service --timeout=180s --insecure-skip-tls-verify=true
          kubectl rollout status deployment/inventory-service --timeout=180s --insecure-skip-tls-verify=true
          kubectl rollout status deployment/payment-service --timeout=180s --insecure-skip-tls-verify=true
          kubectl rollout status deployment/notification-service --timeout=180s --insecure-skip-tls-verify=true

  # ==========================================
  # STAGE 4: Dynamic Testing (DAST)
  # ==========================================
  dast-scan:
    name: Stage 4 - OWASP ZAP DAST API Scan
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: OWASP ZAP API DAST Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: "http://${{ secrets.ORDER_SERVICE_HOST }}:8000/openapi.json"
          format: openapi
          fail_action: false

      - name: Upload OWASP ZAP Scan Results to DefectDojo
        if: always()
        run: |
          if [ -f zap_report.xml ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=ZAP Scan" \
              -F "file=@zap_report.xml" \
              -F "product_name=VulnerableMart" \
              -F "engagement_name=CI/CD" \
              -F "auto_create_context=true" || true
          fi
