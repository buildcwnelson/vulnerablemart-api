name: CI/CD Pipeline - VulnerableMart

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build, Scan & Sign Microservices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define Image Tag
        id: meta
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vulnerablemart/${{ matrix.service }}:${{ github.sha }}"
          echo "image=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }} \
            ./${{ matrix.service }}

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push ${{ steps.meta.outputs.image }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker Image (Keyless OIDC)
        run: |
          cosign sign --yes ${{ steps.meta.outputs.image }}

  deploy:
    name: Deploy to K3s Cluster
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/order-api --timeout=90s
